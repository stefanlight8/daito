[workspace]
resolver = "3"
members = ["daito", "crates/daito-*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "./LICENSE"

[workspace.dependencies]
daito-gateway = { path = "./crates/daito-gateway" }
daito-rpc = {path = "./crates/daito-rpc"}

serde = { version = "1.0.228", features = ["derive"] }
tokio = {
    version = "1.50.0",
    features = [
        "bytes",
        "io-util",
        "libc",
        "mio",
        "net",
        "tracing",
        "sync",
        "time"
    ]
}
