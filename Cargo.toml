[workspace]
resolver = "3"
members = ["daito", "crates/daito-*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
daito-api = { path= "./crates/daito-api" }
daito-rpc = { path = "./crates/daito-rpc" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
tokio = {
    version = "1.50.0",
    features = [
        "bytes",
        "io-util",
        "libc",
        "mio",
        "net",
        "tracing",
        "sync",
        "time"
    ]
}
tracing = "0.1.44"
